name: 清聊 APK 构建（签名）

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KS_PASS }}
      KEY_ALIAS: yomi
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version
        run: |
          FLUTTER_VERSION=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 配置签名证书
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then
            keytool -genkeypair -keystore android/app/release.keystore \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Qchat, O=qingliao"
          fi
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KS_PASS
          EOF
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: 依赖
        run: flutter pub get

      - name: 构建（按 ABI 分包，Gradle 直接签名）
        run: flutter build apk --release --split-per-abi

      - name: 列出产物
        run: ls -la build/app/outputs/apk/release/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: qchat-signed-apks
          path: build/app/outputs/apk/release/*.apk
