name: 生成签名密钥（一次性）

on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: keystore 口令（生成后请立即保存）
        required: true
        type: string

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: 生成 RSA4096 keystore（25 年）
        run: |
          keytool -genkeypair \
            -keystore release.keystore \
            -alias yomi \
            -keyalg RSA -keysize 4096 -validity 9125 \
            -storepass "${{ inputs.passphrase }}" \
            -keypass "${{ inputs.passphrase }}" \
            -dname "CN=Qing Assistant, O=qingzhuli, C=CN"
          keytool -list -v -keystore release.keystore -storepass "${{ inputs.passphrase }}" | head -20
          base64 -w0 release.keystore > release.keystore.b64
          ls -la release.keystore release.keystore.b64

      - name: 上传密钥产物
        uses: actions/upload-artifact@v4
        with:
          name: qingzhuli-keystore
          path: |
            release.keystore
            release.keystore.b64
          retention-days: 1
