name: 清助理 APK 构建（签名）

on:
  workflow_dispatch:
  push:
    branches: [main]
    # 纯文档改动不必打一次包
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KS_PASS }}
      KEY_ALIAS: yomi
    steps:
      - uses: actions/checkout@v7

      - name: Read Flutter version
        run: |
          FLUTTER_VERSION=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 配置签名证书
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 secret，拒绝使用临时签名（会导致签名漂移、无法覆盖升级）"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then
            echo "::error::keystore 解码失败"
            exit 1
          fi
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KS_PASS
          EOF
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: 依赖
        run: flutter pub get

      # 冷启动要下 NDK(≈1G)+CMake+3 套 Rust std，占掉 9 分钟；缓存后基本秒过
      - name: 缓存 Gradle / NDK / CMake
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.ANDROID_SDK_ROOT }}/ndk
            ${{ env.ANDROID_SDK_ROOT }}/cmake
          key: android-build-${{ hashFiles('android/**/*.gradle', 'android/gradle.properties', 'pubspec.yaml') }}
          restore-keys: |
            android-build-

      - name: 构建（按 ABI 分包，Gradle 直接签名）
        run: flutter build apk --release --split-per-abi

      - name: 校验产物
        run: |
          ls -la build/app/outputs/apk/release/
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          echo "--- 签名校验 ---"
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$APK" | head -20
          test -f "$APK" || (echo "APK 不存在" && exit 1)

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: qingzhuli-signed-apks
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
